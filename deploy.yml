# Builds cv/cv.tex into cv.pdf and publishes it together with the website.
# Runs on every push to main, so the downloadable CV always matches the LaTeX source.
name: Build CV and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compile the CV
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cv
          root_file: cv.tex

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
          cp cv/cv.pdf _site/cv.pdf

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
